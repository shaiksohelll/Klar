name: Scheduled Ingestion

on:
  schedule:
    - cron: "0 5 * * *"   # daily 05:00 UTC (10:30 IST)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ingestion
        run: |
          curl -fsS -X POST "$KLAR_API_URL/api/ingest" \
            -H "x-ingest-secret: $INGEST_SECRET" \
            --max-time 120 --retry 2 --retry-delay 30 --retry-connrefused
        env:
          KLAR_API_URL: ${{ secrets.KLAR_API_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
